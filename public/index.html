<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14161c">
<title>Last Card Chaos</title>
<style>
:root{--mercan:#e53935;--deniz:#1e78e0;--cimen:#2e9e4f;--gunes:#f2b200;--fg:#f3f1ec;--mut:#9aa0ad;--panel:#232733}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 35%,#262b38,#14161c 70%);color:var(--fg);
  font:16px/1.3 system-ui,-apple-system,sans-serif;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 8px)}
.screen{display:none;max-width:520px;margin:0 auto}.screen.on{display:block}
#game.on{display:flex;flex-direction:column;min-height:calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
#game #hand{margin-top:auto}
h1{font-size:30px;letter-spacing:3px;text-align:center;margin:48px 0 4px}
.sub{text-align:center;color:var(--mut);margin:0 0 28px}
input,button{font:inherit;border-radius:12px;border:0;padding:14px 16px}
input{width:100%;background:var(--panel);color:var(--fg);user-select:text}
button{background:var(--fg);color:#14161c;font-weight:700;width:100%;margin-top:12px;cursor:pointer}
button:disabled{opacity:.35}
.ghost{background:none;color:var(--mut);font-weight:400;font-size:14px}
ul{list-style:none;padding:0;margin:0}
#lobbyList li{background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:8px}
#opps{display:flex;gap:8px}
.opp{flex:1;background:var(--panel);border-radius:10px;padding:5px 6px;text-align:center;border:2px solid transparent;font-size:12px;transition:.2s;display:flex;align-items:baseline;justify-content:center;gap:6px;flex-wrap:wrap}
.opp.turn{border-color:var(--fg)}
.opp b{font-size:16px}
/* "senden sonra" kutunun üst kenarına oturan rozet: kutu boyunu değiştirmez, isimler aynı hizada kalır */
.opp .nx{position:absolute;top:-8px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.5px;line-height:14px;padding:0 7px;border-radius:7px;background:var(--gunes);color:#14161c}
#opps{padding-top:8px}
.opp i{font-style:normal;color:var(--mut);font-size:11px}
.opp button{margin-top:2px;padding:6px;background:var(--mercan);color:#fff;font-size:13px}
#sayBtn{display:none;background:var(--gunes)}
#scores{width:240px;margin-bottom:8px}#scores li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #fff2}
#table{display:flex;align-items:center;justify-content:center;gap:28px;margin:22px 0 6px}
.card{width:64px;height:96px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;position:relative;
  font-weight:800;font-size:28px;color:#fff;border:3px solid #fff;box-shadow:0 2px 6px #0007;text-shadow:0 1px 2px #0006;transition:transform .15s,opacity .15s}
.card small{position:absolute;top:2px;left:5px;font-size:11px}
.card.mercan{background:var(--mercan)}.card.deniz{background:var(--deniz)}.card.cimen{background:var(--cimen)}.card.gunes{background:var(--gunes)}
.card.wild{background:conic-gradient(var(--mercan) 0 25%,var(--deniz) 0 50%,var(--cimen) 0 75%,var(--gunes) 0)}
.card.back{background:repeating-linear-gradient(45deg,#2c3140 0 6px,#383e50 6px 12px);font-size:13px;cursor:pointer}
.card.back.ok{box-shadow:0 0 0 3px var(--fg),0 2px 6px #0007}
/* Masa: yığın tam ortada, deste solda; altta kalan kartlar kayık ve dönük görünür */
#table{flex:1;position:relative;display:flex;align-items:center;justify-content:center;margin:8px 0;min-height:230px}
#pile{position:absolute;left:4px;top:50%;width:64px;height:96px;margin-top:-48px}
#topWrap{position:relative;width:128px;height:192px}
#topWrap .card{position:absolute;inset:0;width:100%;height:100%;font-size:64px;border-width:4px;border-radius:14px}
#topWrap .card small{font-size:16px;top:4px;left:8px}
#topWrap .under{filter:brightness(.75)}
#colorTag{text-align:center;font-weight:700;margin-top:10px}
#status{text-align:center;font-size:18px;font-weight:700;margin-top:14px;min-height:24px}
#log{text-align:center;color:var(--mut);font-size:14px;min-height:36px;margin-top:4px}
#hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 0 8px}
#hand .card{width:52px;height:78px;font-size:22px;cursor:pointer}
#hand.myturn .card:not(.ok){opacity:.35}
#hand .card.ok{transform:translateY(-6px)}
#passBtn{display:none}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:10px;display:none;z-index:9}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:5;padding:24px}
.modal.on{display:flex}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:240px}
.pick button{height:90px;margin:0;color:#fff}
.modal h2{margin:0 0 16px}
/* Sıra sende: ekran kenarı yerdeki renkle nabız gibi parlar, ortada bir kez büyük yazı çıkar */
body.myturn::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:4;border:5px solid var(--turnc);box-shadow:inset 0 0 50px var(--turnc);animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{opacity:.3}}
#status.me{font-size:20px;color:var(--turnc);animation:beat 1s ease-in-out infinite}
#status.big{font-size:30px;letter-spacing:1px}
@keyframes beat{50%{transform:scale(1.08)}}
.opp.turn{animation:ring 1.2s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 5px #fff5}}
#flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;letter-spacing:2px;pointer-events:none;opacity:0;z-index:6;text-shadow:0 4px 24px #000}
#flash.go{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.12)}70%{opacity:1;transform:scale(1)}100%{opacity:0}}
/* Çekilen kart desteden uçarak gelir, atılan kart yere oturur */
.card.new{animation:fly .55s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes fly{from{transform:translate(var(--dx),var(--dy)) scale(.7) rotate(-14deg);opacity:.3}}
#top.pop{animation:pop .35s ease-out backwards}
/* Atılan kart atanın kutusundan ortaya, çekilen kapalı kart desteden rakibin kutusuna uçar */
.card.big.flying{font-size:64px;border-width:4px;border-radius:14px}
.flying{position:fixed;z-index:8;margin:0;pointer-events:none;animation:throw .65s cubic-bezier(.25,.8,.25,1) backwards}
@keyframes throw{from{transform:translate(var(--dx),var(--dy)) scale(var(--s)) rotate(-25deg)}}
.opp.threw{animation:threw .9s ease-out}
@keyframes threw{0%{background:var(--fg);color:#14161c}100%{background:var(--panel)}}
@keyframes pop{from{transform:scale(1.9) rotate(10deg);opacity:0}}
.card.back:active{transform:scale(.92)}
/* Aynı sayıdan eşi olan kart: köşede ×2 rozeti; seçimde eklenebilecek eşler sarı ışıkla yanıp söner */
.card .twin{position:absolute;top:2px;right:3px;font-size:10px;font-style:normal;line-height:14px;background:#000b;color:#fff;border-radius:7px;padding:0 4px}
#hand .card.can{animation:can 1s ease-in-out infinite}
@keyframes can{0%,100%{box-shadow:0 0 0 2px var(--gunes)}50%{box-shadow:0 0 0 5px #e9a81f55,0 0 14px var(--gunes)}}
#hand .card.sel{transform:translateY(-16px);box-shadow:0 0 0 3px var(--gunes),0 6px 12px #0008}
.opp{position:relative}
.delta{position:absolute;top:-10px;right:4px;font-style:normal;font-weight:800;color:var(--mercan);font-size:20px;animation:rise 1.4s ease-out forwards}
@keyframes rise{from{transform:translateY(10px);opacity:0}20%{opacity:1}to{transform:translateY(-14px);opacity:0}}
#music{position:fixed;right:62px;bottom:calc(env(safe-area-inset-bottom) + 10px);width:44px;height:44px;padding:0;border-radius:50%;background:var(--panel);font-size:20px;z-index:7;margin:0}
#volBox{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 62px);z-index:8;display:none;align-items:center;gap:10px;background:var(--panel);padding:10px 14px;border-radius:14px;box-shadow:0 4px 16px #0008}
#volBox.on{display:flex}
#vol{width:170px;accent-color:var(--gunes)}
#volVal{min-width:26px;text-align:right;font-size:14px}
#mute{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);width:44px;height:44px;padding:0;border-radius:50%;background:var(--panel);font-size:20px;z-index:7;margin:0}
#stackBar{display:none;gap:8px}#stackBar button{margin-top:4px}
/* Arka plan yerdeki rengin soluk tonu; renk değişince yeni renk yukarıdan aşağı kayar */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#14161c}
#bg div{position:absolute;inset:0;animation:slide .8s cubic-bezier(.25,.8,.25,1) both}
@keyframes slide{from{transform:translateY(-100%)}}
/* Ceza çekenle dalga: ortada dalgalanan yazı, her yöne saçılan 🤣 */
#taunt{position:fixed;inset:0;z-index:9;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:0;transition:opacity .35s}
#taunt.on{opacity:1;background:#0007;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#taunt .msg{font-size:34px;font-weight:900;text-align:center;padding:12px 20px;margin:0 12px;background:#000b;border-radius:22px;text-shadow:0 4px 18px #000,0 0 2px #000;animation:tauntIn 3.4s ease-out both;position:relative;z-index:1}
#taunt .msg .w{white-space:nowrap}
#taunt .msg span{display:inline-block;animation:wave .7s ease-in-out infinite,hue 1.4s linear infinite;animation-delay:calc(var(--i) * 60ms)}
@keyframes wave{50%{transform:translateY(-14px) rotate(-6deg)}}
@keyframes hue{0%{color:var(--gunes)}33%{color:var(--mercan)}66%{color:#fff}100%{color:var(--gunes)}}
@keyframes tauntIn{0%{transform:scale(.3);opacity:0}8%{transform:scale(1.15);opacity:1}14%{transform:scale(1)}90%{opacity:1}100%{opacity:0}}
#taunt .rain{position:absolute;top:-70px;left:var(--x);font-size:var(--sz);font-style:normal;animation:rain var(--t) linear both;animation-delay:var(--d)}
@keyframes rain{to{transform:translateY(calc(100vh + 140px)) rotate(var(--r))}}
#selBar{display:none;gap:8px}#selBar button{margin-top:4px}
/* Tur süresi: ekranın en üstünde azalan çubuk; son 5 saniyede kırmızı ve nabızlı */
#timer{position:fixed;left:0;right:0;top:0;height:6px;z-index:7;display:none;background:#0006}
#timer i{display:block;height:100%;background:var(--turnc);transform-origin:left;transition:background .3s}
#timer.low i{background:var(--mercan);animation:glow .5s ease-in-out infinite}
/* Saniye sayacı: ortadaki kartın altında yuvarlak; kenarındaki halka süreyle boşalır */
#clock{margin:2px auto 0}
/* Kaosa kalan sıra: masanın sağ kenarında, destenin karşısında */
/* Masaya gömülü yuva gibi: koyu, içe basık; son sıralarda yalnız rakam sararır */
#chaosIn{position:absolute;right:4px;top:50%;margin-top:-48px;width:64px;height:96px;border-radius:10px;border:1px solid #ffffff14;
  background:linear-gradient(180deg,#0000004d,#00000026);box-shadow:inset 0 4px 12px #000b,inset 0 -1px 0 #ffffff12;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.15;color:#ffffff8c;font-weight:700}
#chaosIn b{display:block;font-size:26px;line-height:1.1;color:#ffffffcc}
#chaosIn.soon b{color:var(--gunes)}
#chaosIn i{display:block;margin-top:3px;font-style:normal;font-weight:800;color:var(--gunes)}
#clock{width:40px;height:40px;border-radius:50%;display:none;place-items:center;flex:none;background:conic-gradient(var(--turnc) calc(var(--p) * 1turn), #ffffff22 0);box-shadow:0 2px 10px #0008}
#clock.on{display:grid}
#clock b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#14161c;font-size:15px;font-weight:800}
#clock.low{background:conic-gradient(var(--mercan) calc(var(--p) * 1turn), #ffffff22 0);animation:beat .5s ease-in-out infinite}
#clock.low b{color:var(--mercan)}
/* Son kart gerilimi: tek kartı kalanın kutusu kırmızı nabız, ekran bir kez sarsılır, ortada uyarı */
.opp.one{border-color:var(--mercan);animation:one .8s ease-in-out infinite}
@keyframes one{50%{box-shadow:0 0 0 6px #ef5b4c66,0 0 18px var(--mercan)}}
#hand.one{animation:one .8s ease-in-out infinite;border-radius:14px}
#game.shake{animation:shake .5s linear}
@keyframes shake{10%,50%,90%{transform:translateX(-7px)}30%,70%{transform:translateX(7px)}}
#alarm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 20px;font-size:32px;font-weight:900;color:var(--mercan);pointer-events:none;opacity:0;z-index:6;text-shadow:0 0 20px #000,0 4px 24px #000}
#alarm.go{animation:flash 1.8s ease-out}
/* Bilgi yazısı (deste karıştırıldı, kimin elini aldın): ortada 3,5 saniye durur */
#notice{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:9;pointer-events:none;opacity:0;text-align:center;width:min(90vw,420px);
  background:#000c;border:2px solid var(--gunes);border-radius:18px;padding:14px 18px;font-size:22px;font-weight:900;box-shadow:0 10px 40px #000a}
#notice small{display:block;margin-top:6px;font-size:14px;font-weight:600;color:var(--mut)}
#notice.go{animation:notice 3.6s ease-out}
@keyframes notice{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}16%{transform:translate(-50%,-50%) scale(1)}88%{opacity:1}100%{opacity:0}}
#pile.shuffle{animation:shuf .9s ease-in-out}
@keyframes shuf{20%,60%{transform:rotate(-8deg) translateX(-4px)}40%,80%{transform:rotate(8deg) translateX(4px)}}
/* Tepki fırlatma: rakip kutusuna dokununca açılan menü ve uçan emoji */
#reactMenu{position:fixed;z-index:8;display:none;gap:6px;background:var(--panel);padding:6px;border-radius:14px;box-shadow:0 4px 16px #0009;transform:translateX(-50%)}
#reactMenu.on{display:flex}
#reactMenu button{margin:0;width:46px;height:46px;padding:0;font-size:26px;background:#ffffff14;border-radius:10px}
.reactFly{position:fixed;z-index:9;font-size:34px;font-style:normal;pointer-events:none;transform:translate(-50%,-50%);animation:reactFly .7s cubic-bezier(.3,.7,.3,1) both,reactOut .5s ease-in .9s forwards}
.reactFly.me{animation:reactFly .7s cubic-bezier(.3,.7,.3,1) both,splat .9s ease-out .7s forwards}
@keyframes reactFly{from{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.6) rotate(-40deg)}to{transform:translate(-50%,-50%) scale(var(--s)) rotate(10deg)}}
@keyframes reactOut{to{opacity:0;transform:translate(-50%,-50%) scale(var(--s)) rotate(10deg)}}
@keyframes splat{0%{transform:translate(-50%,-50%) scale(var(--s)) rotate(10deg)}25%{transform:translate(-50%,-50%) scale(calc(var(--s) * 1.25),calc(var(--s) * .8))}100%{transform:translate(-50%,-50%) scale(var(--s));opacity:0}}
/* Kaos çarkı: seçenekler hızla döner, birinde durur */
#chaos{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000a;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none}
#chaos.on{display:flex;animation:fadeIn .25s;pointer-events:auto} /* çark dönerken alttaki oyuna dokunulmasın */
@keyframes fadeIn{from{opacity:0}}
#chaos h2{margin:0;font-size:34px;letter-spacing:3px;color:var(--gunes);text-shadow:0 0 24px #e9a81f88}
#chaosRoll{font-size:22px;font-weight:800;padding:12px 20px;border-radius:16px;background:var(--panel);border:3px solid var(--gunes);min-width:260px;text-align:center;visibility:hidden}
#chaosRoll.done{visibility:visible}
#wheelWrap{position:relative;width:min(78vw,300px);aspect-ratio:1}
#wheel{position:absolute;inset:0;border-radius:50%;border:6px solid #fff;box-shadow:0 0 0 4px #0006,0 10px 40px #000a;transition:transform 4s cubic-bezier(.1,.7,.12,1)}
#wheel span{position:absolute;left:50%;top:50%;width:0;height:0;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000}
#wheel span b{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font-weight:inherit;text-align:center;line-height:1.1}
#pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid #fff;filter:drop-shadow(0 3px 4px #000a)}
#hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:#14161c;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-size:26px;z-index:1}
#chaosRoll.done{animation:beat .5s ease-in-out 3;background:var(--gunes);color:#14161c}
.chip{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:9px;font-size:12px;background:var(--mercan);color:#fff;vertical-align:middle}
/* Gece ödülleri */
#awards{width:280px;margin-top:6px;font-size:14px}
#awards h3{margin:6px 0;font-size:15px;color:var(--gunes);text-align:center}
#awards li{padding:3px 0}
</style>
</head>
<body>

<section id="join" class="screen">
  <h1 data-t="title"></h1>
  <p class="sub" data-t="tagline"></p>
  <input id="name" maxlength="16" data-tph="namePh" autocomplete="off">
  <button id="joinBtn" data-t="join"></button>
</section>

<section id="lobby" class="screen">
  <h1 data-t="table"></h1>
  <p class="sub" data-t="lobbyInfo"></p>
  <ul id="lobbyList"></ul>
  <button id="startBtn" data-t="start"></button>
  <button class="ghost" data-reset data-t="reset"></button>
</section>

<section id="game" class="screen">
  <div id="opps"></div>
  <div id="table">
    <div id="pile" class="card back"></div>
    <div id="topWrap"></div>
    <div id="chaosIn"></div>
  </div>
  <div id="clock"><b></b></div>
  <div id="colorTag"></div>
  <div id="status"></div>
  <div id="log"></div>
  <div id="selBar"><button id="playSel"></button><button id="clearSel" class="ghost" style="width:40%" data-t="cancel"></button></div>
  <div id="stackBar">
    <button id="takeBtn"></button>
  </div>
  <button id="sayBtn" data-t="say"></button>
  <button id="passBtn" data-t="pass"></button>
  <div id="hand"></div>
  <button class="ghost" data-reset data-t="reset"></button>
</section>

<div id="picker" class="modal">
  <h2 data-t="pick"></h2>
  <div class="pick">
    <button data-c="mercan" style="background:var(--mercan)"></button>
    <button data-c="deniz" style="background:var(--deniz)"></button>
    <button data-c="cimen" style="background:var(--cimen)"></button>
    <button data-c="gunes" style="background:var(--gunes)"></button>
  </div>
  <button class="ghost" id="pickCancel" style="width:240px" data-t="cancel"></button>
</div>


<div id="win" class="modal">
  <h2 id="winText"></h2>
  <ul id="scores"></ul>
  <ul id="awards"></ul>
  <button id="againBtn" style="width:240px"></button>
</div>

<div id="bg"></div>
<div id="taunt"></div>
<div id="toast"></div>
<div id="flash" data-t="yourTurn"></div>
<div id="alarm"></div>
<div id="notice"></div>
<div id="timer"><i></i></div>
<div id="reactMenu"><button data-e="🍅">🍅</button><button data-e="😂">😂</button><button data-e="💀">💀</button><button data-e="🔥">🔥</button></div>
<div id="chaos"><h2 data-t="wheel"></h2><div id="wheelWrap"><div id="pointer"></div><div id="wheel"></div><div id="hub">🌀</div></div><div id="chaosRoll"></div></div>
<button id="mute" data-taria="sound">🔊</button>
<button id="music" data-taria="musicVol">🎵</button>
<div id="volBox"><span>🎵</span><input id="vol" type="range" min="0" max="100" step="5" data-taria="musicVol"><b id="volVal"></b></div>

<script>
const $ = s => document.querySelector(s);
// Arayüz yazıları. Dil sunucudan gelir (GAME_LANG=tr ya da en); oyunu kuran seçer, herkes aynı dili görür.
// Interface texts. The language comes from the server (GAME_LANG=tr or en): whoever hosts picks it for everyone.
const I18N = {
  tr: {
    title: 'LAST CARD CHAOS', tagline: 'Rengi ya da sembolü eşle, elini ilk bitiren kazanır.', namePh: 'Adın', join: 'Masaya otur',
    table: 'MASA', lobbyInfo: '2 ile 4 kişi oynanır. Herkes gelince başlat; herkese 12 kart dağıtılır, 500 puana ilk ulaşan kazanır.',

  }
  wasMyTurn = mine;

  // Son kart gerilimi: biri yeni tek karta düştüyse sarsıntı ve uyarı; tek kartta kalan varken kalp atışı.
  $('#hand').classList.toggle('one', S.hand.length === 1 && !S.winner);
  const ones = S.players.filter(p => p.count === 1 && !S.winner).map(p => p.name);
  const fresh = ones.filter(nm => !prevOnes.includes(nm));
  if (fresh.length && prevOnes !== null) {
    const a = $('#alarm');
    a.textContent = fresh.map(nm => nm === S.players[me].name ? T.oneMe : T.oneOther(nm)).join(' ');
    a.classList.remove('go'); void a.offsetWidth; a.classList.add('go');
    const gm = $('#game'); gm.classList.remove('shake'); void gm.offsetWidth; gm.classList.add('shake');
    navigator.vibrate?.(200);
  }
  prevOnes = ones;
  setHeart(ones.length > 0);

  // Süre dolduysa herkes duyar.
  if (prevTimeouts !== null && S.timeouts > prevTimeouts) sound('timeout'); // yeni elde sayaç 0'dan başlar, aşağıda eşitlenir
  prevTimeouts = S.timeouts;

  prevChaos = logMax; // çarklar yukarıda kuyruğa alındı

  // Deste bitip yeniden karıldıysa: yerdeki kartlar desteye uçar, deste sallanır, yazı çıkar.
  if (S.reshuffle && prevShuffle !== null && S.reshuffle.seq !== prevShuffle) {
    const from = $('#topWrap').getBoundingClientRect(), p = $('#pile').getBoundingClientRect();
    for (let k = 0; k < 8; k++) fly('<div class="card back"></div>', from, p, k * 70).style.setProperty('--s', '2');
    const pile = $('#pile'); pile.classList.remove('shuffle'); void pile.offsetWidth; pile.classList.add('shuffle');
    sound('deal');
    notice(`${T.shuffled}<small>${T.deckN(S.reshuffle.round)}</small>`);
  }
  prevShuffle = S.reshuffle ? S.reshuffle.seq : 0;

  // Fırlatılan tepkiler: yalnız bu sayfa açıldıktan sonrakiler oynar.
  for (const r of S.reacts || []) if (prevReact !== null && r.seq > prevReact) showReact(r);
  prevReact = Math.max(prevReact || 0, ...(S.reacts || []).map(r => r.seq));

  // Gece ödülleri el sonu penceresinde.
  $('#awards').innerHTML = S.awards && S.awards.length ? `<h3>${T.awards}</h3>` + S.awards.map(a => `<li>${a.e} <b>${esc(a.title)}</b>: ${esc(a.name)} <span style="color:var(--mut)">(${a.n} ${esc(a.unit)})</span></li>`).join('') : '';
}
let prevOnes = null, prevTimeouts = null, prevChaos = null, prevReact = null, tickSec = null, prevShuffle = null;

// Süre çubuğu her karede sunucu saatine göre çizilir.
(function frame() {
  const t = $('#timer');
  const on = S && S.started && S.me >= 0 && !S.winner && S.turnStart;
  t.style.display = on ? 'block' : 'none';
  const ck = $('#clock');
  ck.classList.toggle('on', !!on);
  if (on) {
    const left = Math.max(0, S.turnStart + S.turnMs - (Date.now() + offset)), p = Math.min(1, left / S.turnMs);
    t.querySelector('i').style.transform = `scaleX(${p})`;
    ck.style.setProperty('--p', p);
    ck.querySelector('b').textContent = Math.min(Math.ceil(left / 1000), S.turnMs / 1000);
    t.classList.toggle('low', left < 5000);
    ck.classList.toggle('low', left < 5000);
    const sec = Math.ceil(left / 1000);
    if (S.me === S.turn && left < 5000 && left > 0 && sec !== tickSec) sound('tick'); // son 5 saniye, yalnız sıradakine
    tickSec = sec;
  }
  requestAnimationFrame(frame);
})();

function notice(html) {
  const n = $('#notice'); n.innerHTML = html;
  n.classList.remove('go'); void n.offsetWidth; n.classList.add('go');
}

// Kaos çarkıfelek: dilimler her çevirmede sunucudan gelir (oyuncu dilimleri, eller, ceza, renk yasakları);
// çark sunucunun seçtiği dilimde durur. Art arda gelen çevirmeler sırayla oynar.
const DRAW_COLORS = ['#e8730c', '#11998e', '#8e44ad', '#c2185b', '#5d4037', '#00838f'];
const slotColor = w => w.kind === 'swap' ? '#7b4fd0' : w.kind === 'double' ? '#3a3f4b' : w.kind === 'draw' ? DRAW_COLORS[w.who % DRAW_COLORS.length] : `var(--${w.color})`;
const slotLabel = w => w.kind === 'swap' ? T.slotSwap : w.kind === 'double' ? T.slotDouble : w.kind === 'draw' ? `🎴<br>${esc(S.players[w.who].name)}<br>+${w.n}` : T.slotBan(NAMES[w.color]);
let wheelTurn = 0, chaosQueue = [], chaosBusy = false, chaosUntil = 0;
function queueChaos(c) {
  chaosQueue.push(c);
  chaosUntil = Math.max(chaosUntil, Date.now()) + 6200; // dalga gösterisi çarklar bitince
  if (!chaosBusy) nextChaos();
}
function nextChaos() {
  const c = chaosQueue.shift();
  if (!c) { chaosBusy = false; $('#chaos').classList.remove('on'); return; }
  chaosBusy = true;
  const box = $('#chaos'), roll = $('#chaosRoll'), wheel = $('#wheel');
  const seg = 360 / c.wheel.length, r = 'calc(min(78vw, 300px) * .33)';
  // Yeni çarkı dönmeden önce sıfır açıda çiz
  wheel.style.transition = 'none'; wheel.style.transform = 'rotate(0deg)'; wheelTurn = 0;
  wheel.style.background = `conic-gradient(${c.wheel.map((w, k) => `${slotColor(w)} ${k * seg}deg ${(k + 1) * seg}deg`).join(',')})`;
  wheel.innerHTML = c.wheel.map((w, k) => `<span style="transform:rotate(${k * seg + seg / 2}deg) translateY(calc(${r} * -1))"><b>${slotLabel(w)}</b></span>`).join('');
  void wheel.offsetWidth; wheel.style.transition = '';
  const center = c.slot * seg + seg / 2, jitter = (Math.random() - .5) * seg * .6;
  wheelTurn = 360 * 6 + (360 - center) + jitter;
  box.classList.add('on'); roll.classList.remove('done');
  sound('chaos');
  requestAnimationFrame(() => { wheel.style.transform = `rotate(${wheelTurn}deg)`; });
  let lastSlot = null; // dilimler okun altından geçtikçe tık sesi
  const t0 = performance.now();
  (function ticks() {
    const m = new DOMMatrix(getComputedStyle(wheel).transform);
    const deg = ((Math.atan2(m.b, m.a) * 180 / Math.PI) + 360) % 360;
    const under = Math.floor(((360 - deg) % 360) / seg);
    if (lastSlot !== null && under !== lastSlot) sound('tick');
    lastSlot = under;
    if (performance.now() - t0 < 4000) requestAnimationFrame(ticks);
  })();
  const final = c.kind === 'swap' ? T.finSwap : c.kind === 'ban' ? T.finBan(NAMES[c.color])
    : c.kind === 'double' ? T.finDouble : T.finDraw(esc(S.players[c.who].name), c.n);
  setTimeout(() => { roll.innerHTML = final; roll.classList.add('done'); sound('react'); }, 4100);
  if (c.kind === 'swap' && S.me >= 0) setTimeout(() => { // çark kapanınca kimin elini aldığını göster
    const n = S.players.length, from = (((S.me - S.dir) % n) + n) % n, to = (S.me + S.dir + n) % n;
    notice(T.tookHand(esc(S.players[from].name), esc(S.players[to].name)));
  }, 6000);
  setTimeout(nextChaos, 6000);
}

// Tepki: emoji atanın kutusundan hedefin kutusuna uçar; hedef sensen ekranın ortasında büyüyüp yapışır.
const spot = i => i === S.me ? $('#hand') : document.querySelector(`.opp[data-i="${i}"]`);
function showReact(r) {
  const fromEl = spot(r.from), toMe = r.to === S.me;
  if (!fromEl) return;
  const f = fromEl.getBoundingClientRect();
  const t = toMe ? { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 } : spot(r.to)?.getBoundingClientRect();
  if (!t) return;
  const x = t.left + t.width / 2, y = t.top + t.height / 2;
  const el = document.createElement('i');
  el.className = 'reactFly' + (toMe ? ' me' : '');
  el.textContent = r.e;
  Object.assign(el.style, { left: x + 'px', top: y + 'px' });
  el.style.setProperty('--dx', `${f.left + f.width / 2 - x}px`);
  el.style.setProperty('--dy', `${f.top + f.height / 2 - y}px`);
  el.style.setProperty('--s', toMe ? 4 : 1.4);
  document.body.appendChild(el);
  setTimeout(() => sound('react'), 650);
  setTimeout(() => el.remove(), 1700);
  if (toMe) toast(T.threw(S.players[r.from].name, r.e));
}

$('#joinBtn').onclick = async () => {
  const name = $('#name').value.trim();
  if (!name) return toast(T.nameFirst);
  const j = await post('/join', { name });
  if (j.id) { id = j.id; localStorage.setItem('dr-id', id); localStorage.setItem('dr-name', name); connect(); }
};
$('#name').value = localStorage.getItem('dr-name') || '';
$('#name').onkeydown = e => { if (e.key === 'Enter') $('#joinBtn').click(); };
$('#startBtn').onclick = () => post('/start');
$('#againBtn').onclick = () => post('/start');
document.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => confirm(T.resetQ) && post('/reset'));
$('#pile').onclick = () => S && S.me === S.turn && S.drawn === null && post('/act', { type: 'draw' });
$('#passBtn').onclick = () => post('/act', { type: 'pass' });
$('#hand').onclick = e => {
  const el = e.target.closest('.card.ok'); if (!el) return;
  const c = S.hand.find(c => c.id === +el.dataset.id);
  if (sel.length) { sel = sel.includes(c.id) ? sel.filter(x => x !== c.id) : [...sel, c.id]; return render(); }
  // Elde aynı türden başka kart varsa seçim açılır: diğerlerine dokun, sonra "kartı at"
  if (S.hand.some(x => x.id !== c.id && x.v === c.v && !banned(x))) { sel = [c.id]; return render(); }
  if (c.c === null) { pending = [c.id]; openPicker(); }
  else post('/act', { type: 'play', card: c.id });
};
$('#playSel').onclick = () => {
  const card = id => S.hand.find(c => c.id === id);
  const first = sel.find(x => S.stack || playable(card(x))); // ilk atılan yere uymalı; renk son seçilenden gelir
  if (first === undefined) return toast(T.mustMatch);
  const cards = [first, ...sel.filter(x => x !== first)];
  sel = [];
  if (card(first).c === null) { pending = cards; openPicker(); } // jokerler: önce renk
  else post('/act', { type: 'play', cards });
};
$('#mute').onclick = () => { muted = !muted; localStorage.setItem('dr-mute', muted ? '1' : '0'); syncMusic(); };
$('#music').onclick = () => $('#volBox').classList.toggle('on');
$('#vol').oninput = e => { vol = +e.target.value; localStorage.setItem('dr-vol', vol); if (vol > 0) muted = false; syncMusic(); };
document.addEventListener('pointerdown', e => { if (!e.target.closest('#volBox, #music')) $('#volBox').classList.remove('on'); }); // dışarı dokununca kapanır
syncMusic();
$('#clearSel').onclick = () => { sel = []; render(); };
document.querySelectorAll('.pick button').forEach(b => b.onclick = () => {
  $('#picker').classList.remove('on');
  post('/act', pending === null ? { type: 'color', color: b.dataset.c } : { type: 'play', cards: pending, color: b.dataset.c });
});
$('#pickCancel').onclick = () => { if (pending !== null) $('#picker').classList.remove('on'); };
$('#sayBtn').onclick = () => post('/act', { type: 'say' });
let reactTo = null;
$('#opps').onclick = e => {
  if (e.target.closest('[data-catch]')) return post('/act', { type: 'catch' });
  const box = e.target.closest('.opp'); if (!box || !S || S.me < 0) return;
  reactTo = +box.dataset.i; // rakibe dokununca tepki menüsü kutunun altında açılır
  const b = box.getBoundingClientRect(), m = $('#reactMenu');
  Object.assign(m.style, { left: Math.min(Math.max(b.left + b.width / 2, 110), innerWidth - 110) + 'px', top: b.bottom + 8 + 'px' });
  m.classList.add('on');
};
document.querySelectorAll('#reactMenu button').forEach(b => b.onclick = () => {
  $('#reactMenu').classList.remove('on');
  post('/react', { to: reactTo, e: b.dataset.e });
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('#reactMenu, #opps')) $('#reactMenu').classList.remove('on'); });
$('#takeBtn').onclick = () => post('/act', { type: 'draw' });

applyStatic();
connect();
</script>
</body>
</html>
